<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全栈技术选型器 · Fullstack Map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232563eb'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'%3EF%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  button { font-family: inherit; font-size: inherit; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f5f5f4; color: #18181b; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 960px; margin: 0 auto; padding: 32px 20px 80px; }

  /* ===== 头部 ===== */
  header { margin-bottom: 20px; }
  header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  header p { color: #71717a; font-size: 14px; margin-top: 6px; }

  /* 全局搜索框 */
  .search-box {
    margin-top: 14px; position: relative; max-width: 420px;
  }
  .search-box input {
    width: 100%; padding: 10px 14px 10px 38px; font-size: 14px;
    border: 1.5px solid #e4e4e7; border-radius: 8px; background: #fff;
    outline: none; transition: border-color .15s;
  }
  .search-box input:focus { border-color: #2563eb; }
  .search-box .s-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: #a1a1aa; width: 16px; height: 16px; pointer-events: none;
  }
  .search-results {
    display: none; position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    background: #fff; border: 1px solid #e4e4e7; border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.08); max-height: 360px; overflow-y: auto; z-index: 50;
  }
  .search-results.open { display: block; }
  .sr-group { padding: 8px 12px 4px; font-size: 11px; color: #a1a1aa; font-weight: 600; }
  .sr-item {
    padding: 8px 14px; cursor: pointer; font-size: 13px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .sr-item:hover { background: #f5f5f5; }
  .sr-item .sr-cat { color: #a1a1aa; font-size: 11px; }

  /* 进度条 */
  .steps-bar { display: flex; gap: 6px; margin-top: 18px; flex-wrap: wrap; align-items: center; }
  .step-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 12px; border-radius: 999px; font-size: 13px;
    border: 1px solid #e4e4e7; background: #fff; color: #71717a; cursor: pointer;
    transition: all .15s;
  }
  .step-pill:hover { border-color: #a1a1aa; }
  .step-pill.active { border-color: #2563eb; color: #2563eb; font-weight: 600; background: #eff6ff; }
  .step-pill.done { border-color: #bbf7d0; color: #16a34a; background: #f0fdf4; }
  .step-pill.done::before { content: "✓"; font-weight: 700; }
  .page-count { margin-left: auto; font-size: 12px; color: #a1a1aa; }

  /* ===== 主区 ===== */
  .card-wrap {
    background: #fff; border: 1px solid #e4e4e7; border-radius: 12px;
    padding: 28px 26px; margin-bottom: 20px;
    animation: fadeUp .25s ease;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .step-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .step-title { font-size: 20px; font-weight: 700; }
  .step-sub { font-size: 13px; color: #71717a; margin: 4px 0 18px; }
  .rec-btn {
    border: 1px dashed #2563eb; color: #2563eb; background: #eff6ff;
    border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
    white-space: nowrap; transition: all .15s;
  }
  .rec-btn:hover { background: #dbeafe; }

  .group { margin-bottom: 24px; }
  .group:last-child { margin-bottom: 4px; }
  .group-label {
    font-size: 13px; font-weight: 600; color: #52525b;
    margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
  }
  .group-label .must { color: #dc2626; font-weight: 700; }
  .group-label .count { margin-left: auto; font-weight: 400; color: #a1a1aa; font-size: 12px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(195px, 1fr)); gap: 10px; }
  @media (min-width: 720px) {
    .grid:has(> :nth-child(4):last-child) { grid-template-columns: repeat(4, 1fr); }
    .grid:has(> :nth-child(5):last-child) { grid-template-columns: repeat(3, 1fr); }
  }
  .opt {
    position: relative; border: 1.5px solid #e4e4e7; border-radius: 10px;
    padding: 12px 14px; cursor: pointer; background: #fff;
    transition: border-color .12s, background .12s, transform .1s;
  }
  .opt:hover { border-color: #a1a1aa; transform: translateY(-1px); }
  .opt.selected { border-color: #2563eb; background: #eff6ff; }
  .opt.selected .opt-name { color: #1d4ed8; font-weight: 700; }
  .opt.disabled { opacity: .55; cursor: default; }
  .opt-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 3px; }
  .opt-name { font-size: 15px; font-weight: 600; }
  .opt-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .opt-desc { font-size: 12px; color: #71717a; line-height: 1.5; display: block; }
  .opt-tags { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
  .opt-tag {
    font-size: 10px; color: #4f6b9a; background: #eef2f7;
    padding: 1px 7px; border-radius: 999px; white-space: nowrap;
  }
  .opt .check {
    width: 20px; height: 20px; border-radius: 50%;
    background: #2563eb; color: #fff; font-size: 12px; font-weight: 700;
    display: none; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .opt.selected .check { display: flex; }
  .opt .info-btn {
    width: 22px; height: 22px; border-radius: 50%; padding: 0;
    border: 1px solid #e4e4e7; background: #fff; color: #71717a;
    font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all .12s; flex-shrink: 0;
  }
  .opt .info-btn:hover { border-color: #2563eb; color: #2563eb; background: #eff6ff; }

  /* ===== 底部导航 ===== */
  .nav { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .kbd-tip { font-size: 12px; color: #a1a1aa; }
  .kbd-tip kbd {
    border: 1px solid #e4e4e7; border-bottom-width: 2px; border-radius: 4px;
    padding: 1px 6px; font-size: 11px; background: #fff; font-family: inherit;
  }
  .btn {
    padding: 11px 24px; border-radius: 8px; font-size: 14px; font-weight: 600;
    border: 1px solid #e4e4e7; background: #fff; color: #3f3f46; cursor: pointer;
    transition: all .12s;
  }
  .btn:hover { border-color: #a1a1aa; }
  .btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  .btn.primary:hover { background: #1d4ed8; }
  .btn.primary:disabled { background: #bfdbfe; border-color: #bfdbfe; cursor: not-allowed; }

  /* ===== 汇总页 ===== */
  .flow {
    display: flex; align-items: stretch; gap: 0; margin: 18px 0 26px;
    overflow-x: auto; padding-bottom: 6px;
  }
  .flow-node {
    flex: 1; min-width: 128px; background: #f8fafc; border: 1.5px solid #bfdbfe;
    border-radius: 10px; padding: 12px 10px; text-align: center;
  }
  .flow-node .fn-label { font-size: 11px; color: #2563eb; font-weight: 700; letter-spacing: .05em; }
  .flow-node .fn-value { font-size: 14px; font-weight: 700; margin-top: 4px; }
  .flow-node .fn-sub { font-size: 11px; color: #71717a; margin-top: 2px; }
  .flow-arrow { align-self: center; padding: 0 6px; color: #a1a1aa; font-size: 18px; flex: 0 0 auto; }

  .sum-section { border-top: 1px solid #e4e4e7; padding: 14px 0; }
  .sum-section:first-of-type { border-top: none; padding-top: 4px; }
  .sum-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .sum-head h4 { font-size: 15px; font-weight: 700; }
  .sum-edit { font-size: 12px; color: #2563eb; cursor: pointer; background: none; border: none; padding: 4px 8px; }
  .sum-edit:hover { text-decoration: underline; }
  .sum-row { display: flex; gap: 10px; font-size: 13px; padding: 3px 0; align-items: center; }
  .sum-key { min-width: 110px; color: #71717a; font-weight: 500; }
  .sum-val { color: #18181b; font-weight: 600; }
  .sum-info { font-size: 11px; color: #2563eb; cursor: pointer; margin-left: 4px; }
  .sum-info:hover { text-decoration: underline; }

  .actions { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px; padding: 16px 18px; margin-top: 18px; }
  .actions h4 { font-size: 15px; color: #15803d; margin-bottom: 10px; }
  .actions ol { padding-left: 20px; font-size: 13px; line-height: 2; color: #166534; }
  .actions code { background: #dcfce7; padding: 1px 6px; border-radius: 4px; font-size: 12px; }

  .toolbox { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .toolbox .btn { flex: 1; min-width: 130px; }

  /* ===== 详情弹窗 ===== */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-mask.open { display: flex; }
  .modal {
    background: #fff; border-radius: 14px; max-width: 560px; width: 100%;
    max-height: 85vh; overflow-y: auto; padding: 26px 28px;
    animation: fadeUp .2s ease;
  }
  .modal h2 { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
  .modal .modal-cat { font-size: 12px; color: #2563eb; font-weight: 600; margin-bottom: 14px; }
  .modal .modal-body { font-size: 14px; line-height: 1.8; color: #3f3f46; }
  .modal .modal-body p { margin-bottom: 10px; }
  .modal .modal-body b { color: #18181b; }
  .modal .modal-file {
    margin-top: 16px; padding: 10px 12px; background: #f5f5f5; border-radius: 8px;
    font-size: 12px; color: #52525b;
  }
  .modal .modal-file code { background: #e4e4e7; padding: 1px 6px; border-radius: 4px; }
  .modal-close {
    margin-top: 18px; width: 100%; padding: 10px; background: #18181b; color: #fff;
    border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
  }

  @media (max-width: 600px) {
    .card-wrap { padding: 20px 16px; }
    header h1 { font-size: 22px; }
    .grid { grid-template-columns: 1fr; }
    .page-count { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>全栈技术选型器</h1>
    <p>5 步理清你的全栈技术链。点选卡片，点卡片上的 i 按钮看详细知识，顶部可全局搜索。</p>
    <div class="search-box">
      <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input type="text" id="searchInput" placeholder="搜索技术，如：JWT、Redis、Docker...">
      <div class="search-results" id="searchResults"></div>
    </div>
    <div class="steps-bar" id="stepsBar"></div>
  </header>

  <main id="main"></main>

  <div class="nav" id="nav"></div>
</div>

<!-- 详情弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ================= 数据 ================= */
var FW_BY_LANG = {
  "TypeScript": [
    { v: "Express", d: "最简最通用，Node 生态事实标准", tags: ["最简"] },
    { v: "NestJS", d: "企业级模块化，依赖注入与微服务", tags: ["企业级"] },
    { v: "Fastify", d: "高性能 + Schema 校验", tags: ["高性能"] }
  ],
  "Python": [
    { v: "FastAPI", d: "异步 + 类型 + 自动文档，AI 接口首选", tags: ["AI 接口首选"] },
    { v: "Django", d: "全栈自带 Admin，业务快速落地", tags: ["自带后台"] },
    { v: "Flask", d: "极简微框架，灵活自由", tags: ["极简"] }
  ],
  "Java": [
    { v: "Spring Boot", d: "企业级全家桶，微服务生态最成熟", tags: ["企业标准","岗位最多"] },
    { v: "Quarkus", d: "云原生 GraalVM，启动快内存省", tags: ["云原生"] }
  ],
  "Go": [
    { v: "Gin", d: "高并发 REST 事实标准", tags: ["高并发标准"] },
    { v: "Fiber", d: "fasthttp 极速，类 Express 风格", tags: ["极速"] },
    { v: "Echo", d: "高性能，中间件生态好", tags: ["均衡"] }
  ],
  "Rust": [
    { v: "Actix Web", d: "吞吐性能顶尖", tags: ["性能顶尖"] },
    { v: "Axum", d: "Tokio 官方生态，类型安全", tags: ["新项目主流"] }
  ]
};

var RECOMMEND = [
  { framework: "React", meta: "Next.js", ui: "Tailwind + Shadcn" },
  { lang: "TypeScript", fw: "NestJS", api: "REST" },
  { main: "MySQL", cache: "Redis", orm: "Prisma" },
  { auth: "JWT", policies: ["HTTPS", "参数化查询"] },
  { platform: "Vercel", container: "Docker", cicd: "GitHub Actions" }
];

var STEPS = [
  { id: "fe", title: "第 1 步 · 前端开发", sub: "决定界面的技术底座与审美方案",
    groups: [
      { key: "framework", label: "UI 框架", options: [
        { v: "React", d: "生态最大、招聘最多，AI 编程工具支持最好", tags: ["最流行","岗位最多"] },
        { v: "Vue", d: "上手最快、模板直观，国内项目与教学最常见", tags: ["新手友好","国内常用"] },
        { v: "Angular", d: "企业级强约定，TypeScript 原生", tags: ["企业级"] },
        { v: "Svelte", d: "编译型无虚拟 DOM，包体最小", tags: ["极简","高性能"] }
      ]},
      { key: "meta", label: "元框架 / 渲染模式", options: [
        { v: "Next.js", d: "React 默认全栈：路由、SSR、Server Actions", tags: ["React 默认"] },
        { v: "Nuxt", d: "Vue 对应全栈元框架，生态成熟", tags: ["Vue 默认"] },
        { v: "Astro", d: "内容站首选：默认零 JS，岛屿架构", tags: ["内容站首选"] },
        { v: "纯 SPA (Vite)", d: "前后端分离纯客户端，最灵活", tags: ["最灵活"] }
      ]},
      { key: "ui", label: "UI / 审美方案", options: [
        { v: "Tailwind + Shadcn", d: "现代主流，高度定制、组件精致", tags: ["最流行"] },
        { v: "Ant Design", d: "中后台利器，企业组件齐全", tags: ["中后台标配"] },
        { v: "Element Plus", d: "Vue 生态常用，中文文档友好", tags: ["Vue 常用"] },
        { v: "手写 CSS", d: "完全自定义，学习样式本质", tags: ["学习向"] }
      ]}
    ]},
  { id: "be", title: "第 2 步 · 后端开发", sub: "先选语言，框架会跟着语言自动联动",
    groups: [
      { key: "lang", label: "后端语言", options: [
        { v: "TypeScript", d: "前后端同语言，类型统一", tags: ["全栈同语言"] },
        { v: "Python", d: "AI 生态最好，开发效率高", tags: ["AI 首选"] },
        { v: "Java", d: "企业级标准，岗位最多", tags: ["企业岗位多"] },
        { v: "Go", d: "高并发微服务之王，部署简单", tags: ["高并发"] },
        { v: "Rust", d: "极致性能与内存安全", tags: ["极致性能"] }
      ]},
      { key: "fw", label: "后端框架", dependsOn: "lang", options: [] },
      { key: "api", label: "API 协议", options: [
        { v: "REST", d: "最通用、调试简单，90% 项目首选", tags: ["最通用"] },
        { v: "GraphQL", d: "按需取数，前端灵活", tags: ["复杂查询"] },
        { v: "gRPC", d: "高性能二进制，微服务内部通信", tags: ["微服务内部"] }
      ]}
    ]},
  { id: "db", title: "第 3 步 · 数据库", sub: "数据存哪里、怎么读",
    groups: [
      { key: "main", label: "主数据库", options: [
        { v: "MySQL", d: "最常用，教学与企业标配", tags: ["教学企业标配"] },
        { v: "PostgreSQL", d: "功能最强，复杂查询与 JSON", tags: ["功能最强"] },
        { v: "MongoDB", d: "文档型，Schema 灵活快速迭代", tags: ["灵活"] },
        { v: "SQLite", d: "单文件本地库，原型零成本", tags: ["零配置"] }
      ]},
      { key: "cache", label: "缓存", options: [
        { v: "Redis", d: "会话、限流、排行榜标配", tags: ["标配缓存"] },
        { v: "进程内缓存", d: "内存变量级，单机够用", tags: ["单机够用"] },
        { v: "暂无", d: "初期不需要，后续再加", tags: ["后期再加"] }
      ]},
      { key: "orm", label: "数据访问层", options: [
        { v: "Prisma", d: "TS 最流行，类型安全、迁移直观", tags: ["TS 最流行"] },
        { v: "Drizzle", d: "轻量 SQL 构建器，贴近 SQL", tags: ["轻量"] },
        { v: "SQLAlchemy", d: "Python ORM 标准", tags: ["Python 标准"] },
        { v: "MyBatis", d: "Java 常用，SQL 可控性强", tags: ["Java 常用"] },
        { v: "原生 SQL", d: "最直接，学习与简单项目", tags: ["学习向"] }
      ]}
    ]},
  { id: "sec", title: "第 4 步 · 安全与认证", sub: "用户怎么登录、接口怎么防攻击",
    groups: [
      { key: "auth", label: "认证方案", options: [
        { v: "JWT", d: "无状态令牌，前后端分离常用", tags: ["前后端分离标配"] },
        { v: "Session+Cookie", d: "传统服务端会话，简单易懂", tags: ["简单网站"] },
        { v: "Auth.js (NextAuth)", d: "开箱即用，支持多种登录方式", tags: ["开箱即用"] },
        { v: "第三方 OAuth", d: "微信/GitHub/Google 登录", tags: ["免自建密码"] }
      ]},
      { key: "policies", label: "安全策略（可多选）", multi: true, options: [
        { v: "HTTPS", d: "全站加密，部署平台通常自动配证书", tags: ["必选"] },
        { v: "XSS 防护", d: "输入转义 / CSP，防注入脚本" },
        { v: "CSRF 防护", d: "双重提交令牌，防跨站伪造" },
        { v: "速率限制", d: "防刷接口与暴力破解" },
        { v: "参数化查询", d: "防 SQL 注入，用 ORM 默认满足" },
        { v: "安全响应头", d: "HSTS/CSP 等，缩小攻击面" }
      ]}
    ]},
  { id: "ops", title: "第 5 步 · 部署与云服务", sub: "代码怎么上线、域名与 HTTPS 怎么配",
    groups: [
      { key: "platform", label: "部署平台", options: [
        { v: "Vercel", d: "Next.js 首选，免费额度大，自动 HTTPS", tags: ["新手首选","免费额度大"] },
        { v: "阿里云", d: "国内合规、访问快，学生/企业常用", tags: ["国内合规"] },
        { v: "AWS", d: "国际大厂生态最全，学云原生", tags: ["国际大厂"] },
        { v: "Railway/Render", d: "前后端 + 数据库一键托管", tags: ["个人项目友好"] },
        { v: "自建服务器", d: "VPS 最自由，自配域名/IP/安全组", tags: ["最自由"] }
      ]},
      { key: "container", label: "容器化", options: [
        { v: "Docker", d: "一次构建到处运行，团队标配", tags: ["团队标配"] },
        { v: "Kubernetes", d: "大规模集群编排，复杂微服务", tags: ["大规模"] },
        { v: "暂不需要", d: "小项目直接平台部署即可", tags: ["小项目省"] }
      ]},

/* ================= 状态 ================= */
function freshPicks() {
  var p = [];
  for (var i = 0; i < STEPS.length; i++) {
    var g = {};
    STEPS[i].groups.forEach(function (gr) { g[gr.key] = gr.multi ? [] : null; });
    p.push(g);
  }
  return p;
}
var state = { step: 0, picks: freshPicks() };

function decodeHash() {
  var m = location.hash.match(/#s=(.+)/);
  if (!m) return;
  try {
    var p = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    if (p && p.length === 5) {
      p.forEach(function (g, i) {
        STEPS[i].groups.forEach(function (gr) {
          if (g && g[gr.key] !== undefined) state.picks[i][gr.key] = g[gr.key];
        });
      });
    }
  } catch (e) {}
}
function encodeHash() {
  try {
    var data = btoa(unescape(encodeURIComponent(JSON.stringify(state.picks))));
    history.replaceState(null, "", "#s=" + data);
  } catch (e) {}
}
function save() {
  try { localStorage.setItem("fullstack-map", JSON.stringify(state.picks)); } catch (e) {}
  encodeHash();
}
try {
  decodeHash();
  if (location.hash.length < 3) {
    var s = localStorage.getItem("fullstack-map");
    if (s) { var p = JSON.parse(s); if (p && p.length === 5) state.picks = p; }
  }
} catch (e) {}

/* ================= 工具 ================= */
function el(tag, cls, html) {
  var d = document.createElement(tag || "div");
  if (cls) d.className = cls;
  if (html !== undefined) d.innerHTML = html;
  return d;
}
function groupCount(i) {
  var s = STEPS[i], done = 0;
  s.groups.forEach(function (g) {
    var v = state.picks[i][g.key];
    if (g.multi ? v.length > 0 : v) done++;
  });
  return [done, s.groups.length];
}
function currentStepComplete(i) { return groupCount(i)[0] === groupCount(i)[1]; }

/* 详情弹窗 */
function openDetail(name) {
  var d = DETAILS[name];
  if (!d) return;
  var modal = document.getElementById("modal");
  modal.innerHTML =
    "<h2>" + name + "</h2>" +
    '<div class="modal-cat">' + d.cat + "</div>" +
    '<div class="modal-body">' + d.body + "</div>" +
    (d.file ? '<div class="modal-file">资料库完整扩展：<code>' + d.file + "</code>（在你的知识库目录下）</div>" : "") +
    '<button class="modal-close" id="modalClose">关闭</button>';
  document.getElementById("modalMask").classList.add("open");
  document.getElementById("modalClose").onclick = closeModal;
}
function closeModal() { document.getElementById("modalMask").classList.remove("open"); }
document.getElementById("modalMask").addEventListener("click", function (e) {
  if (e.target === this) closeModal();
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") closeModal();
});

/* ================= 渲染 ================= */
function renderBar() {
  var bar = document.getElementById("stepsBar");
  bar.innerHTML = "";
  STEPS.forEach(function (s, i) {
    var pill = el("span", "step-pill" + (i === state.step ? " active" : (currentStepComplete(i) ? " done" : "")));
    pill.textContent = (i + 1) + " " + s.title.split("·")[1].trim();
    pill.onclick = function () { state.step = i; render(); };
    bar.appendChild(pill);
  });
  bar.appendChild(el("span", "page-count", "第 " + (state.step + 1 > 5 ? 5 : state.step + 1) + " / 5 步"));
}

function renderStep() {
  var i = state.step;
  var s = STEPS[i];
  var main = document.getElementById("main");
  main.innerHTML = "";

  var wrap = el("div", "card-wrap");
  var head = el("div", "step-head");
  head.appendChild(el("div", null, "<div class='step-title'>" + s.title + "</div>"));
  var recBtn = el("button", "rec-btn", "采用新手推荐 ↓");
  recBtn.onclick = function () {
    var rec = RECOMMEND[i];
    Object.keys(rec).forEach(function (k) { state.picks[i][k] = rec[k]; });
    save(); render();
  };
  head.appendChild(recBtn);
  wrap.appendChild(head);
  wrap.appendChild(el("div", "step-sub", s.sub));

  s.groups.forEach(function (g) {
    var options = g.options;
    if (g.dependsOn === "lang") {
      var lang = state.picks[i].lang;
      options = lang && FW_BY_LANG[lang] ? FW_BY_LANG[lang] :
        [{ v: "（请先选择后端语言）", d: "选完语言后这里会显示对应框架", disabled: 1 }];
    }

    var groupEl = el("div", "group");
    var gl = el("div", "group-label",
      "<span>" + g.label + "</span>" + (g.multi ? '<span class="must">*</span>' : "") +
      '<span class="count">' + (g.multi ? "已选 " + state.picks[i][g.key].length + " 项" : "") + "</span>");
    groupEl.appendChild(gl);

    var grid = el("div", "grid");
    options.forEach(function (op) {
      var picked = g.multi ?
        (state.picks[i][g.key].indexOf(op.v) >= 0) :
        (state.picks[i][g.key] === op.v);
      var o = el("div", "opt" + (picked ? " selected" : "") + (op.disabled ? " disabled" : ""));
      var tags = (op.tags || []).map(function (t) { return '<span class="opt-tag">' + t + "</span>"; }).join("");
      var hasDetail = DETAILS[op.v] ? '<button class="info-btn" title="查看详细知识">i</button>' : "";
      o.innerHTML = '<div class="opt-head"><span class="opt-name">' + op.v + "</span>" +
        '<div class="opt-actions">' +
        (hasDetail ? '<button class="info-btn" title="查看详细知识">i</button>' : "") +
        '<span class="check">✓</span>' +
        "</div></div>" +
        '<span class="opt-desc">' + op.d + "</span>" +
        (tags ? '<div class="opt-tags">' + tags + "</div>" : "");

      // 点 i 按钮不触发选中
      var infoBtn = o.querySelector(".info-btn");
      if (infoBtn) infoBtn.onclick = function (e) { e.stopPropagation(); openDetail(op.v); };

      o.onclick = function () {
        if (op.disabled) return;
        if (g.multi) {
          var arr = state.picks[i][g.key];
          var idx = arr.indexOf(op.v);
          if (idx >= 0) arr.splice(idx, 1); else arr.push(op.v);
        } else {
          state.picks[i][g.key] = (state.picks[i][g.key] === op.v) ? null : op.v;
          if (g.key === "lang" && state.picks[i].fw) state.picks[i].fw = null;
        }
        save(); render();
      };
      grid.appendChild(o);
    });
    groupEl.appendChild(grid);
    wrap.appendChild(groupEl);
  });

  main.appendChild(wrap);
}

  if (f.meta === "Next.js") a.push("运行 <code>npx create-next-app@latest</code> 初始化项目");

  else a.push("用 Docker 打包应用，在平台一键部署");
  return a.slice(0, 6);
}

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text); done(); });
    } else { fallbackCopy(text); done(); }
  };
  function fallbackCopy(t) {
    var ta = document.createElement("textarea");
    ta.value = t; document.body.appendChild(ta); ta.select();

  var lines = ["我的全栈技术栈", ""];
  var titles = ["前端开发", "后端开发", "数据库", "安全与认证", "部署与云服务"];
  var keys = [["framework", "meta", "ui"], ["lang", "fw", "api"], ["main", "cache", "orm"], ["auth", "policies"], ["platform", "container", "cicd"]];
  for (var i = 0; i < 5; i++) {
    lines.push("【" + titles[i] + "】");
    keys[i].forEach(function (k) {
      var v = state.picks[i][k];
      lines.push("  - " + (Array.isArray(v) ? (v.join("、") || "（未选）") : (v || "（未选）")));
    });
    lines.push("");
  }
  return lines.join("\n");
}

function renderNav() {
  var nav = document.getElementById("nav");
  nav.innerHTML = "";
  if (state.step < STEPS.length) {
    var prev = el("button", "btn", "← 上一步");
    prev.onclick = function () { if (state.step > 0) state.step--; render(); };
    if (state.step === 0) prev.style.visibility = "hidden";
    var tip = el("span", "kbd-tip", '<kbd>←</kbd> <kbd>→</kbd> 切换步骤');
    var next = el("button", "btn primary", "下一步 →");
    if (!currentStepComplete(state.step)) next.disabled = true;
    next.onclick = function () { if (currentStepComplete(state.step)) { state.step++; save(); render(); } };
    nav.appendChild(prev); nav.appendChild(tip); nav.appendChild(next);
  } else {
    var back = el("button", "btn", "← 返回第 1 步");
    back.onclick = function () { state.step = 0; render(); };
    nav.appendChild(back);
  }
}

/* 全局搜索 */
var searchInput = document.getElementById("searchInput");
var searchResults = document.getElementById("searchResults");
searchInput.addEventListener("input", function () {
  var q = this.value.trim().toLowerCase();
  if (!q) { searchResults.classList.remove("open"); searchResults.innerHTML = ""; return; }
  var hits = [];
  Object.keys(DETAILS).forEach(function (name) {
    var d = DETAILS[name];
    var hay = (name + " " + d.cat + " " + d.body).toLowerCase();
    if (name.toLowerCase().indexOf(q) >= 0 || hay.indexOf(q) >= 0) {
      hits.push({ name: name, cat: d.cat });
    }
  });
  if (!hits.length) {
    searchResults.innerHTML = '<div class="sr-group">没有匹配的技术</div>';
  } else {
    searchResults.innerHTML = hits.slice(0, 20).map(function (h) {
      return '<div class="sr-item" data-name="' + h.name + '"><span>' + h.name + '</span><span class="sr-cat">' + h.cat + "</span></div>";
    }).join("");
    searchResults.querySelectorAll(".sr-item").forEach(function (item) {
      item.onclick = function () {
        openDetail(this.getAttribute("data-name"));
        searchResults.classList.remove("open");
        searchInput.value = "";
      };
    });
  }
  searchResults.classList.add("open");
});
document.addEventListener("click", function (e) {
  if (!e.target.closest(".search-box")) searchResults.classList.remove("open");
});

document.addEventListener("keydown", function (e) {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (e.key === "ArrowRight" && state.step < STEPS.length && currentStepComplete(state.step)) { state.step++; save(); render(); }
  else if (e.key === "ArrowLeft" && state.step > 0) { state.step--; render(); }
});

function render() {
  renderBar();
  if (state.step >= STEPS.length) renderSummary(); else renderStep();
  renderNav();
}
render();
</script>
